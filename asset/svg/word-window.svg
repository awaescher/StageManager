<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940">
  <!-- ウィンドウ背景 -->
  <rect width="1600" height="940" fill="white" rx="8" />
  
  <!-- タイトルバー -->
  <g>
    <rect width="1600" height="40" fill="#2B579A" rx="8 8 0 0" />
    <text x="50" y="25" fill="white" font-family="Segoe UI" font-size="14">ドキュメント1 - Word</text>
    <!-- ウィンドウコントロール -->
    <g transform="translate(1480,0)">
      <rect x="0" y="0" width="40" height="40" fill="transparent" />
      <rect x="40" y="0" width="40" height="40" fill="transparent" />
      <rect x="80" y="0" width="40" height="40" fill="transparent" />
      <text x="20" y="25" fill="white" font-size="16">─</text>
      <text x="60" y="25" fill="white" font-size="16">□</text>
      <text x="100" y="25" fill="white" font-size="16">×</text>
    </g>
  </g>
  
  <!-- リボンメニュー -->
  <g transform="translate(0,40)">
    <rect width="1600" height="100" fill="#F3F3F3" />
    <text x="20" y="25" fill="#444" font-family="Segoe UI" font-size="12">ホーム</text>
    <text x="80" y="25" fill="#444" font-family="Segoe UI" font-size="12">挿入</text>
    <text x="140" y="25" fill="#444" font-family="Segoe UI" font-size="12">デザイン</text>
  </g>
  
  <!-- ドキュメント領域の背景（グレー） -->
  <rect x="0" y="140" width="1600" height="800" fill="#E6E6E6" />
  
  <!-- A4ドキュメント領域（中央寄せ） -->
  <g transform="translate(502.5,160)">
    <!-- ドロップシャドウ効果 -->
    <rect width="595" height="740" fill="black" opacity="0.1" transform="translate(3,3)" />
    <!-- A4用紙の背景（595x842ポイント = A4サイズ） -->
    <rect width="595" height="740" fill="white" stroke="#E0E0E0" />
    
    <!-- Microsoft ロゴ -->
    <g transform="translate(50,50)">
      <rect x="0" y="0" width="40" height="40" fill="#00A4EF" />
      <rect x="50" y="0" width="40" height="40" fill="#7FBA00" />
      <rect x="0" y="50" width="40" height="40" fill="#F25022" />
      <rect x="50" y="50" width="40" height="40" fill="#FFB900" />
      <text x="100" y="70" fill="#666" font-family="Segoe UI" font-size="40">Microsoft</text>
    </g>
    
    <!-- 詳細な本文 -->
    <g transform="translate(50,220)">
      <text font-family="Segoe UI" font-size="12" fill="#333">
        <tspan x="0" y="0">マイクロソフトは、1975年にビル・ゲイツとポール・アレンによって</tspan>
        <tspan x="0" y="25">設立されました。現在では、クラウドコンピューティング、AI技術、</tspan>
        <tspan x="0" y="50">生産性向上ツールなど、幅広い分野でイノベーションを推進しています。</tspan>
        <tspan x="0" y="90">私たちの主力製品Microsoft 365は、以下の特徴を備えています：</tspan>
        <tspan x="0" y="130">・ Word、Excel、PowerPointなどの統合されたオフィスツール</tspan>
        <tspan x="0" y="155">・ Microsoft Teamsによるシームレスなコミュニケーション</tspan>
        <tspan x="0" y="180">・ OneDriveによる安全なクラウドストレージ</tspan>
        <tspan x="0" y="205">・ Microsoft Copilotによる最新のAIサポート</tspan>
        <tspan x="0" y="245">さらに、Azure クラウドプラットフォームでは、企業のデジタル</tspan>
        <tspan x="0" y="270">トランスフォーメーションを強力に支援。Windows 11では、</tspan>
        <tspan x="0" y="295">最新のユーザーエクスペリエンスを提供しています。</tspan>
        <tspan x="0" y="335">これからも、革新的な技術で、よりよい未来の創造に貢献して</tspan>
        <tspan x="0" y="360">まいります。</tspan>
        <tspan x="0" y="420">Microsoft 一同</tspan>
        <tspan x="0" y="480" fill="#666" font-size="10">※この文章はAIで作成したダミーテキストです。</tspan>
      </text>
    </g>
  </g>
</svg>