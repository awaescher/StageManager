<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
    <!-- Window background -->
    <rect width="800" height="600" fill="#ffffff"/>
    
    <!-- Title bar with PowerPoint brand color -->
    <rect width="800" height="32" fill="#B7472A"/>
    <text x="40" y="22" font-family="Segoe UI" font-size="14" fill="#ffffff">プレゼンテーション1 - PowerPoint</text>
    
    <!-- Window controls -->
    <g transform="translate(690,0)">
        <!-- Minimize -->
        <rect x="0" y="0" width="36" height="32" fill="#B7472A"/>
        <line x1="12" y1="16" x2="24" y2="16" stroke="#ffffff" stroke-width="1"/>
        
        <!-- Maximize -->
        <rect x="36" y="0" width="36" height="32" fill="#B7472A"/>
        <rect x="46" y="10" width="16" height="12" fill="none" stroke="#ffffff" stroke-width="1"/>
        
        <!-- Close -->
        <rect x="72" y="0" width="36" height="32" fill="#B7472A"/>
        <line x1="82" y1="10" x2="98" y2="22" stroke="#ffffff" stroke-width="1"/>
        <line x1="98" y1="10" x2="82" y2="22" stroke="#ffffff" stroke-width="1"/>
    </g>
    
    <!-- Ribbon -->
    <rect y="32" width="800" height="100" fill="#f3f3f3"/>
    
    <!-- Tabs -->
    <rect y="32" width="800" height="24" fill="#f1f1f1"/>
    <text x="20" y="50" font-family="Segoe UI" font-size="13" fill="#252525">ファイル</text>
    <text x="90" y="50" font-family="Segoe UI" font-size="13" fill="#252525">ホーム</text>
    <text x="160" y="50" font-family="Segoe UI" font-size="13" fill="#252525">挿入</text>
    <text x="220" y="50" font-family="Segoe UI" font-size="13" fill="#252525">デザイン</text>
    <text x="290" y="50" font-family="Segoe UI" font-size="13" fill="#252525">アニメーション</text>
    
    <!-- Main content area -->
    <rect y="132" width="800" height="468" fill="#f0f0f0"/>
    
    <!-- Slide preview -->
    <rect x="100" y="160" width="600" height="380" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
    <text x="320" y="350" font-family="Segoe UI" font-size="16" fill="#666666">ここにテキストを入力</text>
    
    <!-- Slide thumbnails -->
    <rect x="10" y="160" width="80" height="60" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
    <text x="45" y="195" font-family="Segoe UI" font-size="14" fill="#252525">1</text>
    
    <!-- Status bar -->
    <rect y="580" width="800" height="20" fill="#f3f3f3"/>
    <text x="10" y="594" font-family="Segoe UI" font-size="12" fill="#666666">スライド 1 / 1</text>
</svg>
