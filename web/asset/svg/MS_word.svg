<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- メインウィンドウの背景 -->
  <rect x="0" y="0" width="800" height="600" rx="15" ry="15" fill="#f3f3f3" stroke="#d0d0d0" stroke-width="2"/>
  
  <!-- タイトルバー -->
  <rect x="0" y="0" width="800" height="40" rx="15" ry="15" fill="#0078d7"/>
  <text x="20" y="25" font-family="Segoe UI" font-size="20" fill="white">Microsoft Word</text>
  
  <!-- ウィンドウズボタン -->
  <line x1="725" y1="20" x2="735" y2="20" stroke="white" stroke-width="2"/> <!-- 最小化ボタン -->
  
  <rect x="755" y="15" width="10" height="10" fill="none" stroke="white" stroke-width="2"/> <!-- 最大化ボタン -->
  
  <line x1="785" y1="15" x2="795" y2="25" stroke="white" stroke-width="2"/>
  <line x1="795" y1="15" x2="785" y2="25" stroke="white" stroke-width="2"/> <!-- 閉じるボタン -->
  
  <!-- メニューとツールバー -->
  <rect x="0" y="40" width="800" height="60" fill="#e0e0e0"/>
  <text x="20" y="70" font-family="Segoe UI" font-size="14" fill="black">File Edit View Insert Format Tools Table Window Help</text>
  
  <!-- 白いA4用紙 -->
  <rect x="100" y="120" width="595" height="842" fill="white" stroke="black" stroke-width="1"/>

