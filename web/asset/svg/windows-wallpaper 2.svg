<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- 背景のグラデーション -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002050;stop-opacity:1" />
    </linearGradient>
    
    <!-- タスクバーの背景グラデーション -->
    <linearGradient id="taskbar-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.9)" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.85)" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#bg-gradient)" />
  
  <!-- 装飾的な波形 -->
  <path d="M0,400 C300,350 600,450 900,400 C1200,350 1500,450 1920,400 L1920,1080 L0,1080 Z" 
        fill="#ffffff" fill-opacity="0.05" />
  
  <!-- Microsoft ロゴ -->
  <g transform="translate(860,440)">
    <!-- ロゴの四角形 -->
    <rect x="0" y="0" width="100" height="100" fill="#F25022" />
    <rect x="110" y="0" width="100" height="100" fill="#7FBA00" />
    <rect x="0" y="110" width="100" height="100" fill="#00A4EF" />
    <rect x="110" y="110" width="100" height="100" fill="#FFB900" />
  </g>
  
  
  
  <!-- タスクバー -->
  <g transform="translate(0,1020)">
    <!-- タスクバーの背景 -->
    <rect width="1920" height="60" fill="url(#taskbar-gradient)" />
    
    <!-- Windows スタートボタン -->
    <g transform="translate(10,10)">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#0078D4" />
      <path d="M10,20 L20,10 L30,20 L20,30 Z" fill="white" />
    </g>
    
    <!-- 検索バー -->
    <g transform="translate(60,10)">
      <rect x="0" y="0" width="200" height="40" rx="20" fill="rgba(0,0,0,0.1)" />
      <text x="40" y="25" fill="#666" font-family="Segoe UI" font-size="14">検索</text>
      <path d="M20,20 m-8,0 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0 M25,25 L28,28" stroke="#666" fill="none" stroke-width="2" />
    </g>
    
    <!-- Copilot アイコン -->
    <g transform="translate(270,10)">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#0078D4" />
      <text x="20" y="25" fill="white" font-family="Segoe UI" font-size="20" text-anchor="middle">✦</text>
    </g>
    
    <!-- Word アイコン (アクティブ状態) -->
    <g transform="translate(320,10)">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#2B579A" />
      <rect x="0" y="38" width="40" height="2" fill="white" />
      <text x="20" y="25" fill="white" font-family="Segoe UI" font-size="14" text-anchor="middle">W</text>
    </g>
    
    <!-- Excel アイコン -->
    <g transform="translate(370,10)">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#217346" />
      <text x="20" y="25" fill="white" font-family="Segoe UI" font-size="14" text-anchor="middle">X</text>
    </g>
    
    <!-- PowerPoint アイコン -->
    <g transform="translate(420,10)">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#B7472A" />
      <text x="20" y="25" fill="white" font-family="Segoe UI" font-size="14" text-anchor="middle">P</text>
    </g>

    <!-- Teams アイコン -->
    <g transform="translate(470,10)">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#464EB8" />
      <!-- 抽象的な人々のアイコン -->
      <path d="M20,12 a5,5 0 1,1 0,10 a5,5 0 1,1 0,-10" fill="white" />
      <path d="M12,28 a8,8 0 0,1 16,0" fill="white" />
      <path d="M13,15 a3,3 0 1,1 0,6 a3,3 0 1,1 0,-6" fill="white" />
      <path d="M27,15 a3,3 0 1,1 0,6 a3,3 0 1,1 0,-6" fill="white" />
      <path d="M8,25 a6,6 0 0,1 12,0" fill="white" opacity="0.8" />
      <path d="M20,25 a6,6 0 0,1 12,0" fill="white" opacity="0.8" />
    </g>

    <!-- Steam アイコン -->
    <g transform="translate(520,10)">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#1B2838" />
      <path d="M20,10 a10,10 0 1,0 0,20 a10,10 0 1,0 0,-20 M15,20 h10" stroke="white" fill="none" stroke-width="2" />
    </g>

    <!-- Notion アイコン -->
    <g transform="translate(520,10)">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#000000" />
      <text x="20" y="25" fill="white" font-family="Segoe UI" font-size="14" text-anchor="middle">N</text>
    </g>

    <!-- VS Code アイコン -->
    <g transform="translate(570,10)">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#007ACC" />
      <path d="M12,20 l8,-8 l8,8 l-8,8 z" fill="white" />
    </g>

    <!-- システムトレイ -->
    <g transform="translate(1500,10)">
      <!-- 入力言語 -->
      <g transform="translate(0,0)">
        <rect x="0" y="5" width="30" height="30" rx="4" fill="transparent" />
        <text x="15" y="25" fill="#666" font-family="Segoe UI" font-size="12" text-anchor="middle">あ</text>
      </g>

      <!-- ネットワーク状態 -->
      <g transform="translate(40,0)">
        <rect x="0" y="5" width="30" height="30" rx="4" fill="transparent" />
        <path d="M5,25 l5,-5 l5,5 l5,-5" stroke="#666" fill="none" stroke-width="2" />
      </g>

      <!-- 音量 -->
      <g transform="translate(80,0)">
        <rect x="0" y="5" width="30" height="30" rx="4" fill="transparent" />
        <path d="M10,20 l5,-5 v10 l-5,-5 M17,15 a5,5 0 0,1 0,10" stroke="#666" fill="none" stroke-width="2" />
      </g>

      <!-- バッテリー -->
      <g transform="translate(120,0)">
        <rect x="0" y="5" width="30" height="30" rx="4" fill="transparent" />
        <rect x="5" y="17" width="20" height="10" stroke="#666" fill="none" stroke-width="2" />
        <rect x="7" y="19" width="16" height="6" fill="#666" />
      </g>

      <!-- 時計と日付 -->
      <g transform="translate(160,0)">
        <rect x="0" y="5" width="100" height="30" rx="4" fill="transparent" />
        <text x="50" y="20" fill="#666" font-family="Segoe UI" font-size="11" text-anchor="middle">2025/01/19</text>
        <text x="50" y="32" fill="#666" font-family="Segoe UI" font-size="11" text-anchor="middle">21:45</text>
      </g>

      <!-- アクションセンターボタン -->
      <g transform="translate(270,0)">
        <rect x="0" y="5" width="30" height="30" rx="4" fill="transparent" />
        <path d="M5,15 h20 M5,25 h20" stroke="#666" fill="none" stroke-width="2" />
      </g>
    </g>
  </g>
</svg>
