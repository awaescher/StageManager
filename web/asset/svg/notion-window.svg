<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
    <!-- Window background -->
    <rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
    
    <!-- Windows title bar -->
    <rect x="0" y="0" width="800" height="32" fill="#1f1f1f"/>
    
    <!-- Window controls -->
    <g transform="translate(720, 0)">
        <!-- Minimize -->
        <rect x="0" y="0" width="26" height="32" fill="#1f1f1f"/>
        <line x1="8" y1="16" x2="18" y2="16" stroke="#ffffff" stroke-width="1"/>
        
        <!-- Maximize -->
        <rect x="26" y="0" width="26" height="32" fill="#1f1f1f"/>
        <rect x="34" y="10" width="10" height="10" fill="none" stroke="#ffffff" stroke-width="1"/>
        
        <!-- Close -->
        <rect x="52" y="0" width="26" height="32" fill="#1f1f1f" class="close-btn"/>
        <g transform="translate(60,10)">
            <line x1="0" y1="0" x2="10" y2="10" stroke="#ffffff" stroke-width="1"/>
            <line x1="0" y1="10" x2="10" y2="0" stroke="#ffffff" stroke-width="1"/>
        </g>
    </g>
    
    <!-- Window title -->
    <text x="35" y="21" font-family="Segoe UI" font-size="12" fill="#ffffff">Notion - Getting Started</text>
    
    <!-- Notion icon -->
    <rect x="8" y="8" width="16" height="16" fill="#ffffff" rx="2"/>
    <text x="10" y="21" font-family="Segoe UI" font-size="14">N</text>
    
    <!-- Left sidebar -->
    <rect x="0" y="32" width="250" height="568" fill="#fbfbfa"/>
    
    <!-- Emoji icon component -->
    <g transform="translate(270, 60)">
        <rect x="0" y="0" width="40" height="40" fill="#f7f6f3" rx="4"/>
        <text x="10" y="28" font-family="Segoe UI" font-size="24">👋</text>
    </g>
    
    <!-- Sidebar items -->
    <g transform="translate(20, 70)">
        <!-- Quick Find -->
        <rect x="0" y="0" width="210" height="30" fill="#ebebea" rx="4"/>
        <text x="40" y="20" font-family="Segoe UI" font-size="13" fill="#37352f">Quick Find</text>
        <path d="M10,15 h6 m3,0 h6" stroke="#37352f" stroke-width="2"/>
        
        <!-- Pages -->
        <g transform="translate(0, 50)">
            <text x="10" y="0" font-family="Segoe UI" font-size="12" fill="#787774">PAGES</text>
            
            <!-- Page items -->
            <g transform="translate(0, 20)">
                <rect x="0" y="0" width="210" height="25" fill="transparent" rx="4"/>
                <text x="30" y="17" font-family="Segoe UI" font-size="14" fill="#37352f">Getting Started</text>
                <circle cx="12" cy="12" r="3" fill="#37352f"/>
            </g>
            
            <g transform="translate(0, 55)">
                <rect x="0" y="0" width="210" height="25" fill="transparent" rx="4"/>
                <text x="30" y="17" font-family="Segoe UI" font-size="14" fill="#37352f">Tasks</text>
                <rect x="8" y="8" width="8" height="8" fill="#37352f"/>
            </g>
        </g>
    </g>
    
    <!-- Main content area -->
    <rect x="250" y="32" width="550" height="568" fill="#ffffff"/>
    
    <!-- Content header -->
    <g transform="translate(270, 140)">
        <!-- Breadcrumb -->
        <text x="0" y="0" font-family="Segoe UI" font-size="12" fill="#787774">Workspace / Getting Started</text>
        
        <!-- Title -->
        <text x="0" y="40" font-family="Segoe UI" font-size="30" fill="#37352f">Getting Started</text>
    </g>
    
    <!-- Content blocks -->
    <g transform="translate(270, 220)">
        <!-- Text block -->
        <rect x="0" y="0" width="510" height="40" fill="#ffffff" rx="4"/>
        <text x="10" y="25" font-family="Segoe UI" font-size="16" fill="#37352f">Welcome to Notion! 👋</text>
        
        <!-- To-do block -->
        <g transform="translate(0, 60)">
            <rect x="0" y="0" width="510" height="35" fill="#ffffff" rx="4"/>
            <rect x="10" y="10" width="15" height="15" fill="none" stroke="#37352f" stroke-width="2" rx="2"/>
            <text x="35" y="23" font-family="Segoe UI" font-size="16" fill="#37352f">Create your first page</text>
        </g>
    </g>
    
    <!-- Add page button -->
    <g transform="translate(20, 540)">
        <rect x="0" y="0" width="210" height="35" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="4"/>
        <text x="40" y="23" font-family="Segoe UI" font-size="14" fill="#37352f">New page</text>
        <text x="15" y="23" font-family="Segoe UI" font-size="18" fill="#37352f">+</text>
    </g>
</svg>
