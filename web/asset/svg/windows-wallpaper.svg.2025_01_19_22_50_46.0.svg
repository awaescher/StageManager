         stroke="#E0E0E0"
         id="rect16" />
      <!-- Microsoft ロゴ -->
      <g
         transform="translate(143.61804,48.513999)"
         id="g20">
        <rect
           x="0"
           y="0"
           width="40"
           height="40"
