           id="rect18" />
        <rect
           x="0"
           y="50"
           width="40"
           height="40"
           fill="#f25022"
           id="rect19" />
        <rect
           x="50"
           y="50"
           width="40"
           height="40"
           fill="#ffb900"
           id="rect20" />
        <text
           x="113.37401"
           y="61.155296"
           fill="#666666"
           font-family="'Segoe UI'"
           font-size="40px"
           id="text20">Microsoft</text>
      </g>
      <!-- 詳細な本文 -->
      <g
         transform="translate(50,220)"
         id="g34">
        <text
           font-family="Segoe UI"
           font-size="12"
           fill="#333"
           id="text34"><tspan
             x="0"
             y="0"
             id="tspan20">マイクロソフトは、1975年にビル・ゲイツとポール・アレンによって</tspan><tspan
             x="0"
             y="25"
             id="tspan21">設立されました。現在では、クラウドコンピューティング、AI技術、</tspan><tspan
             x="0"
             y="50"
             id="tspan22">生産性向上ツールなど、幅広い分野でイノベーションを推進しています。</tspan><tspan
             x="0"
             y="90"
             id="tspan23">私たちの主力製品Microsoft 365は、以下の特徴を備えています：</tspan><tspan
             x="0"
             y="130"
             id="tspan24">・ Word、Excel、PowerPointなどの統合されたオフィスツール</tspan><tspan
             x="0"
             y="155"
             id="tspan25">・ Microsoft Teamsによるシームレスなコミュニケーション</tspan><tspan
             x="0"
             y="180"
             id="tspan26">・ OneDriveによる安全なクラウドストレージ</tspan><tspan
             x="0"
             y="205"
             id="tspan27">・ Microsoft Copilotによる最新のAIサポート</tspan><tspan
             x="0"
             y="245"
             id="tspan28">さらに、Azure クラウドプラットフォームでは、企業のデジタル</tspan><tspan
             x="0"
             y="270"
             id="tspan29">トランスフォーメーションを強力に支援。Windows 11では、</tspan><tspan
             x="0"
             y="295"
             id="tspan30">最新のユーザーエクスペリエンスを提供しています。</tspan><tspan
             x="0"
             y="335"
             id="tspan31">これからも、革新的な技術で、よりよい未来の創造に貢献して</tspan><tspan
             x="0"
             y="360"
             id="tspan32">まいります。</tspan><tspan
             x="0"
             y="420"
             id="tspan33">Microsoft 一同</tspan><tspan
             x="0"
             y="480"
             fill="#666"
             font-size="10"
             id="tspan34">※この文章はAIで作成したダミーテキストです。</tspan></text>
      </g>
    </g>
  </g>
