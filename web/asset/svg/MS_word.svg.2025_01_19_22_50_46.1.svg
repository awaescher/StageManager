<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="800"
   height="600"
   version="1.1"
   id="svg5"
   sodipodi:docname="MS_word.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs5" />
  <sodipodi:namedview
     id="namedview5"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1">
    <sodipodi:guide
       position="0,600"
       orientation="0,800"
       id="guide5"
       inkscape:locked="false" />
    <sodipodi:guide
       position="800,600"
       orientation="600,0"
       id="guide6"
       inkscape:locked="false" />
    <sodipodi:guide
       position="800,0"
       orientation="0,-800"
       id="guide7"
       inkscape:locked="false" />
    <sodipodi:guide
       position="0,0"
       orientation="-600,0"
       id="guide8"
       inkscape:locked="false" />
  </sodipodi:namedview>
  <!-- メインウィンドウの背景 -->
  <rect
     x="0"
     y="0"
     width="800"
     height="600"
     rx="15"
     ry="15"
     fill="#f3f3f3"
     stroke="#d0d0d0"
     stroke-width="2"
     id="rect1" />
  <!-- タイトルバー -->
  <rect
     x="0"
     y="0"
     width="800"
     height="40"
     rx="15"
     ry="15"
     fill="#0078d7"
     id="rect2" />
  <text
     x="20"
     y="25"
     font-family="Segoe UI"
     font-size="20"
     fill="white"
     id="text2">Microsoft Word</text>
  <!-- ウィンドウズボタン -->
  <line
     x1="725"
     y1="20"
     x2="735"
     y2="20"
     stroke="white"
     stroke-width="2"
     id="line2" />
  <!-- 最小化ボタン -->
  <rect
     x="755"
     y="15"
     width="10"
     height="10"
     fill="none"
     stroke="white"
     stroke-width="2"
     id="rect3" />
  <!-- 最大化ボタン -->
  <line
     x1="785"
     y1="15"
     x2="795"
     y2="25"
     stroke="white"
     stroke-width="2"
     id="line3" />
  <line
     x1="795"
     y1="15"
     x2="785"
     y2="25"
     stroke="white"
     stroke-width="2"
     id="line4" />
  <!-- 閉じるボタン -->
  <!-- メニューとツールバー -->
  <rect
     x="0"
     y="40"
     width="800"
     height="60"
     fill="#e0e0e0"
     id="rect4" />
  <text
     x="20"
     y="70"
     font-family="Segoe UI"
     font-size="14"
     fill="black"
     id="text4">File Edit View Insert Format Tools Table Window Help</text>
  <!-- 白いA4用紙 -->
  <rect
     x="100"
     y="120"
     width="595"
     height="842"
     fill="white"
     stroke="black"
     stroke-width="1"
     id="rect5" />
</svg>
