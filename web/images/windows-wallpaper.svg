<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <defs>
        <!-- Background gradient -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1e3799;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#4a69bd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#6a89cc;stop-opacity:1" />
        </linearGradient>
        
        <!-- Window shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
            <feOffset dx="0" dy="4" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Thumbnail shadow -->
        <filter id="thumbnailShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
            <feOffset dx="2" dy="2" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.5" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Glass effect -->
        <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:white;stop-opacity:0.1" />
            <stop offset="100%" style="stop-color:white;stop-opacity:0.05" />
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bgGradient)" />

    <!-- App Thumbnails (Stage Manager Style) -->
    <g transform="translate(40, 200)">
        <!-- PowerPoint Thumbnail -->
        <g transform="translate(0, 0) scale(0.8) skewY(-5)" filter="url(#thumbnailShadow)" opacity="0.8">
            <rect x="0" y="0" width="160" height="120" rx="8" fill="#ffffff" />
            <rect x="0" y="0" width="160" height="24" rx="8" fill="#B7472A" />
            <text x="30" y="16" fill="white" font-family="system-ui" font-size="10">PowerPoint</text>
        </g>

        <!-- Excel Thumbnail -->
        <g transform="translate(0, 140) scale(0.8) skewY(-5)" filter="url(#thumbnailShadow)" opacity="0.8">
            <rect x="0" y="0" width="160" height="120" rx="8" fill="#ffffff" />
            <rect x="0" y="0" width="160" height="24" rx="8" fill="#217346" />
            <text x="30" y="16" fill="white" font-family="system-ui" font-size="10">Excel</text>
        </g>

        <!-- Word Thumbnail (Active) -->
        <g transform="translate(0, 280) scale(0.8) skewY(-5)" filter="url(#thumbnailShadow)">
            <rect x="0" y="0" width="160" height="120" rx="8" fill="#ffffff" />
            <rect x="0" y="0" width="160" height="24" rx="8" fill="#2B579A" />
            <text x="30" y="16" fill="white" font-family="system-ui" font-size="10">Word</text>
        </g>
    </g>

    <!-- Main Window Area (Single Large Window) -->
    <g transform="translate(300, 80)">
        <!-- Word Window (Active) -->
        <g filter="url(#shadow)">
            <rect x="0" y="0" width="1400" height="800" rx="8" fill="#ffffff" />
            <rect x="0" y="0" width="1400" height="32" rx="8" fill="#2B579A" />
            <text x="40" y="21" fill="white" font-family="system-ui" font-size="12">Document1.docx - Word</text>
            <circle cx="1370" cy="16" r="6" fill="#ff606c" />
            <circle cx="1345" cy="16" r="6" fill="#ffbd44" />
            <circle cx="1320" cy="16" r="6" fill="#00ca4e" />
            
            <!-- Window Content Hint -->
            <rect x="20" y="52" width="1360" height="40" rx="4" fill="#f0f0f0" />
            <rect x="20" y="112" width="1360" height="660" rx="4" fill="#f8f8f8" />
        </g>
    </g>

    <!-- Taskbar -->
    <g transform="translate(0, 1000)">
        <rect width="1920" height="80" fill="#0a0a0a" opacity="0.75" />
        <rect width="1920" height="80" fill="url(#glassGradient)" opacity="0.2" />
        
        <!-- Taskbar Icons -->
        <g transform="translate(810, 16)">
            <!-- ... (previous taskbar content) ... -->
            <g transform="translate(0, 0)">
                <rect x="0" y="0" width="48" height="48" rx="8" fill="white" opacity="0.1" />
                <path d="M12,12 L36,12 L36,36 L12,36 Z" fill="white" opacity="0.9" />
            </g>

            <g transform="translate(64, 0)">
                <rect x="0" y="0" width="48" height="48" rx="8" fill="white" opacity="0.1" />
                <circle cx="24" cy="24" r="12" stroke="white" stroke-width="2" fill="none" opacity="0.9" />
                <line x1="33" y1="33" x2="38" y2="38" stroke="white" stroke-width="2" opacity="0.9" />
            </g>

            <g transform="translate(128, 0)">
                <rect x="0" y="0" width="48" height="48" rx="8" fill="#2B579A" opacity="0.9" />
                <text x="24" y="32" fill="white" text-anchor="middle" font-family="system-ui" font-weight="bold" font-size="20">W</text>
            </g>

            <g transform="translate(192, 0)">
                <rect x="0" y="0" width="48" height="48" rx="8" fill="#217346" opacity="0.9" />
                <text x="24" y="32" fill="white" text-anchor="middle" font-family="system-ui" font-weight="bold" font-size="20">X</text>
            </g>

            <g transform="translate(256, 0)">
                <rect x="0" y="0" width="48" height="48" rx="8" fill="#B7472A" opacity="0.9" />
                <text x="24" y="32" fill="white" text-anchor="middle" font-family="system-ui" font-weight="bold" font-size="20">P</text>
            </g>
        </g>

        <!-- System Tray -->
        <g transform="translate(1700, 16)">
            <rect x="0" y="0" width="120" height="48" rx="8" fill="white" opacity="0.1" />
            <text x="60" y="30" fill="white" opacity="0.9" text-anchor="middle" font-family="system-ui" font-size="14">22:00</text>
            
            <g transform="translate(-100, 0)">
                <rect x="0" y="0" width="80" height="48" rx="8" fill="white" opacity="0.1" />
                <path d="M20,30 Q28,22 36,30" stroke="white" stroke-width="2" fill="none" opacity="0.9" />
                <path d="M50,20 L50,36 M54,24 Q60,30 54,36" stroke="white" stroke-width="2" fill="none" opacity="0.9" />
            </g>
        </g>
    </g>
</svg>